server.port=8080
# 조율 제한시간. 누르는 즉시 반영되고, 카드는 사람마다 따로 넘어간다
qc.negotiate-ms=120000
# 시간이 끝났는데 유력 후보에 아직 의견을 안 낸 사람이 있으면 한 번만 이만큼 연장한다
qc.extend-ms=15000
# 공용 화면 보드를 묶어 보내는 간격 (누른 순간과 화면 변화가 바로 이어지지 않게 → 익명)
qc.board-ms=2000
# 결정 규칙: "가장 덜 만족한 사람도 이 값 이상"인 후보 중 👍 최다 (없으면 maximin)
qc.fair-floor=0.5
# 후보가 이보다 적거나, 하한을 넘는 후보가 없으면 AI 중재자가 한 사람에게 조용히 묻는다
qc.mediator-below=4
qc.mediator-timeout-ms=8000
# AI 중재자 모델. 키는 여기 적지 않는다 — 환경변수 ANTHROPIC_API_KEY (없으면 코드 기본 문장으로 동작)
qc.mediator-model=claude-haiku-5-5
# 연결이 끊긴 뒤 이만큼 기다렸다가 정리한다 (새로고침, 잠깐 끊긴 와이파이는 그 안에 돌아온다)
qc.away-grace-ms=30000
# 평문 → 조건 변환에 쓰는 로컬 모델 (유료 API 없음)
qc.ollama-url=http://127.0.0.1:11434
qc.ollama-model=qwen2.5vl:7b
